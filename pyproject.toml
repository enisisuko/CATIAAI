[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catia-mcp"
version = "0.2.0"
description = "MCP Server for CATIA V5/V6 automation - connect cloud LLMs to CATIA CAD/CAM/CAE"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
windows = [
    "pycatia>=0.9.0",
    "pywin32>=306",
    "pyautogui>=0.9.54",
    "pywinauto>=0.6.0",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
package = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
catia-mcp = "catia_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
